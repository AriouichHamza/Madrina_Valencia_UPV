services:

  # ── Base de données MySQL locale (désactivée si BDD externe) ──────────────
  # Pour utiliser une BDD externe : commenter tout ce bloc "db" et adapter
  # les variables DB_* du service backend ci-dessous.
  db:
    image: mysql:8.0
    container_name: madrina_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: MargotDB_2024
      MYSQL_DATABASE: db_roadtomatricula
    volumes:
      - db_data:/var/lib/mysql
      - ./MargotDB.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pMargotDB_2024"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Node.js + Module IA Python ────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: madrina_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ── BDD locale Docker (défaut) ─────────────────────────────────────────
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: MargotDB_2024
      DB_NAME: db_roadtomatricula
      DB_PORT: 3306
      # ── BDD externe : remplacer les valeurs ci-dessus par celles du serveur
      # DB_HOST: mon-serveur.exemple.com   # IP ou nom de domaine
      # DB_USER: mon_user
      # DB_PASSWORD: mon_mot_de_passe
      # DB_NAME: ma_base
      # DB_PORT: 3306
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - backend_public:/app/AsistenteWebTFGBackend/public
      - backend_user_data:/app/AsistenteWebTFGBackend/user_data

  # ── Frontend Angular (servi par Nginx) ────────────────────────────────────
  frontend:
    build:
      context: ./AsistenteWebTFG
      dockerfile: Dockerfile
    container_name: madrina_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  db_data:
  backend_public:
  backend_user_data: