<app-navbar [back]="true"></app-navbar>
<mat-card class="card-login">
  <mat-card-title>Crea tu usuario</mat-card-title>
  <mat-card-content>
    <mat-form-field *ngIf="false" appearance="fill">
      <mat-label>Nombre de usuario</mat-label>
      <input matInput [(ngModel)]="usuario.nombre">
    </mat-form-field>
    <br>
    <mat-form-field appearance="fill">
      <mat-label>Correo electrónico @upv.es o @upv.edu.es</mat-label>
      <input matInput [(ngModel)]="usuario.correo">
    </mat-form-field>
    <br>
    <mat-form-field appearance="fill">
      <mat-label>Contraseña</mat-label>
      <input type="password" matInput [(ngModel)]="usuario.password">
    </mat-form-field>
  </mat-card-content>
  <mat-card-actions align="end">
    <button mat-flat-button color="primary" (click)="signup()">Registrarse</button>
  </mat-card-actions>
</mat-card>
