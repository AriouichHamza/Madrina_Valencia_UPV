<app-navbar [back]="true"></app-navbar>
<div *ngIf="valido == 0 || valido == 1" class="wait-validar">

	<div *ngIf="valido == 0" class="validar-box">
		<mat-icon class="wait-spinner">sync</mat-icon>
		<div class="wait-label">Validando...</div>
	</div>

	<div *ngIf="valido == 1" class="validar-box">
		<mat-icon>close</mat-icon>
		<div class="wait-label">El correo no es válido</div>
	</div>

</div>
<mat-card *ngIf="valido == 2" class="card-login">
	<mat-card-title>Cambiar contraseña para {{usuario.nombre}}</mat-card-title>
	<mat-card-content>
		<mat-form-field appearance="fill">
			<mat-label>Contraseña</mat-label>
			<input type="password" matInput [(ngModel)]="password1">
		</mat-form-field>
		<br>
		<mat-form-field appearance="fill">
			<mat-label>Repetir contraseña</mat-label>
			<input type="password" matInput [(ngModel)]="password2">
		</mat-form-field>
	</mat-card-content>
	<mat-card-actions align="end">
		<button mat-flat-button color="primary" (click)="cambiar()">Cambiar contraseña</button>
	</mat-card-actions>
</mat-card>
