<div class="csv">
  <div class="csv-format">
    <button mat-stroked-button color="primary" (click)="csvRead.click()">
      <mat-icon>file_upload</mat-icon>
      <span>Cargar alumnos</span>
    </button>
    <input type="file" accept=".csv" (change)="onChangeUploadCSV($event.target)" #csvRead>
    <mat-form-field appearance="outline">
      <mat-label>Codificación</mat-label>
      <mat-select [(ngModel)]="pref.encode" (ngModelChange)="readCSV()">
        <mat-option value="ibm866">ibm866</mat-option>
        <mat-option value="latin1">latin1</mat-option>
        <mat-option value="latin2">latin2</mat-option>
        <mat-option value="latin3">latin3</mat-option>
        <mat-option value="utf8">utf8</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Separador</mat-label>
      <mat-select [(ngModel)]="pref.sep" (ngModelChange)="refreshTable()">
        <mat-option value=";">;</mat-option>
        <mat-option value=".">.</mat-option>
        <mat-option value=",">,</mat-option>
        <mat-option value=" ">ESP</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-slide-toggle class="mb-18" [checked]="pref.cabecera" (change)="onChangeHeader($event)">Cabecera</mat-slide-toggle>
  </div>
  <div class="csv-text">
    <mat-form-field appearance="outline">
      <mat-label>CSV Texto</mat-label>
      <textarea matInput [(ngModel)]="plainText" readonly></textarea>
    </mat-form-field>
    
  </div>
  <div class="csv-headers">
    <mat-form-field appearance="outline">
      <mat-label>DNI</mat-label>
      <mat-select [(ngModel)]="selectColumns.dni" (ngModelChange)="refreshTable()">
        <mat-option *ngFor="let option of selectOptions" [value]="option.value" >{{option.label}}</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Apellido 1</mat-label>
      <mat-select [(ngModel)]="selectColumns.apellido1" (ngModelChange)="refreshTable()">
        <mat-option *ngFor="let option of selectOptions" [value]="option.value" >{{option.label}}</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Apellido 2</mat-label>
      <mat-select [(ngModel)]="selectColumns.apellido2" (ngModelChange)="refreshTable()">
        <mat-option *ngFor="let option of selectOptions" [value]="option.value" >{{option.label}}</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <mat-select [(ngModel)]="selectColumns.nombre" (ngModelChange)="refreshTable()">
        <mat-option *ngFor="let option of selectOptions" [value]="option.value" >{{option.label}}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div class="csv-table">
    <table *ngIf="alumnos.length > 0" mat-table [dataSource]="alumnosTable">

      <ng-container matColumnDef="dni">
        <th mat-header-cell *matHeaderCellDef> DNI </th>
        <td mat-cell *matCellDef="let element"> {{element.dni}} </td>
      </ng-container>

      <ng-container matColumnDef="apellidos">
        <th mat-header-cell *matHeaderCellDef> Apellidos </th>
        <td mat-cell *matCellDef="let element"> {{element.apellidos}} </td>
      </ng-container>
    
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
      </ng-container>
    
      <tr mat-header-row *matHeaderRowDef="alumnosHeader"></tr>
      <tr mat-row *matRowDef="let row; columns: alumnosHeader;"></tr>
    </table>
    <div class="csv-table-nada" *ngIf="alumnos.length == 0" >Sin datos</div>
  </div>
</div>
