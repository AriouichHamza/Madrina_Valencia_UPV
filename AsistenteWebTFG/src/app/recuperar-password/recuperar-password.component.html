<h2 mat-dialog-title>Solicitar cambio de contraseña</h2>
<mat-dialog-content class="mat-typography">
  <mat-form-field appearance="fill">
    <mat-label>Correo electrónico del usuario</mat-label>
    <input matInput [(ngModel)]="correo">
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="undefined">Cancelar</button>
  <button mat-flat-button color="primary" (click)="enviar()">Enviar</button>
</mat-dialog-actions>
